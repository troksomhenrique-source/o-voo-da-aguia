<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live agora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="brand">
    <span class="brand-eyebrow">Você está conectado</span>
    <img class="brand-logo" src="assets/aguia.png" alt="O Voo da Águia">
    <h1 class="brand-name">O Voo da Águia</h1>
  </div>

  <div class="live-wrap">
    <p class="live-greeting" id="saudacao"></p>

    <div class="player-frame" id="player-frame">
      <!--
        SUBSTITUA o conteúdo abaixo pelo embed real do seu evento ao vivo do Vimeo.
        No painel do Vimeo (vimeo.com/live ou o evento específico), copie o "Embed code"
        e cole o <iframe> aqui no lugar do placeholder.

        Importante: o chat ao lado do vídeo só aparece automaticamente se este for um
        Vimeo Live Event (produto de live streaming do Vimeo), não um vídeo comum.
      -->
    <div style="padding:56.25% 0 0 0;position:relative;">
      <iframe src="https://vimeo.com/event/6082379/embed/interaction" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; encrypted-media; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen style="position:absolute;top:0;left:0;width:100%;height:100%;">
      </iframe>
    </div>
    </div>
  </div>

  <script>
    // Personaliza a saudação com o nome informado no cadastro, se disponível.
    (function(){
      var params = new URLSearchParams(window.location.search);
      var nome = params.get('nome') || localStorage.getItem('inscricao_nome');
      var saudacao = document.getElementById('saudacao');
      if (nome) {
        saudacao.innerHTML = 'Bem-vindo(a), <strong>' + nome.split(' ')[0] + '</strong>! A transmissão vai começar.';
      } else {
        saudacao.textContent = '';
      }
    })();
  </script>
</body>
</html>
